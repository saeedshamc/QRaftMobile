<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1A1A3A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>

    <!-- Top Left Eye Gradient -->
    <linearGradient id="eyeTLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Top Right Eye Gradient -->
    <linearGradient id="eyeTRGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Bottom Left Eye Gradient -->
    <linearGradient id="eyeBLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Center Q Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas with Drop Shadow -->
  <g filter="url(#shadowFilter)">
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGradient)" />
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="none" stroke="url(#borderGlow)" stroke-width="4" />
  </g>

  <!-- Top-Left Finder Eye -->
  <rect x="80" y="80" width="128" height="128" rx="28" fill="url(#eyeTLGrad)" />
  <rect x="108" y="108" width="72" height="72" rx="14" fill="#0B0F19" />
  <rect x="126" y="126" width="36" height="36" rx="8" fill="#38BDF8" />

  <!-- Top-Right Finder Eye -->
  <rect x="304" y="80" width="128" height="128" rx="28" fill="url(#eyeTRGrad)" />
  <rect x="332" y="108" width="72" height="72" rx="14" fill="#0B0F19" />
  <rect x="350" y="126" width="36" height="36" rx="8" fill="#818CF8" />

  <!-- Bottom-Left Finder Eye -->
  <rect x="80" y="304" width="128" height="128" rx="28" fill="url(#eyeBLGrad)" />
  <rect x="108" y="332" width="72" height="72" rx="14" fill="#0B0F19" />
  <rect x="126" y="350" width="36" height="36" rx="8" fill="#34D399" />

  <!-- Connecting Micro Data Nodes -->
  <rect x="240" y="88" width="32" height="32" rx="8" fill="#818CF8" />
  <rect x="240" y="392" width="32" height="32" rx="8" fill="#2DD4BF" />
  <rect x="392" y="240" width="32" height="32" rx="8" fill="#C084FC" />
  <rect x="88" y="240" width="32" height="32" rx="8" fill="#38BDF8" />

  <!-- Center "Q" Craft Glyph -->
  <g>
    <!-- Q Ring with Perfect Geometry -->
    <path d="M 256,170 C 206,170 166,210 166,260 C 166,310 206,350 256,350 C 277,350 297,342 312,330 L 336,354 C 342,360 352,360 358,354 L 368,344 C 374,338 374,328 368,322 L 344,298 C 352,286 356,274 356,260 C 356,210 306,170 256,170 Z M 256,206 C 286,206 310,230 310,260 C 310,273 305,285 296,294 L 276,274 C 270,268 260,268 254,274 L 244,284 C 238,290 238,300 244,306 L 264,326 C 255,331 245,334 234,334 C 204,334 180,310 180,280 C 180,250 204,226 234,226 C 242,226 250,228 256,232 Z" fill="url(#qGrad)" />

    <!-- Q Craft Dynamic Tail Spark -->
    <polygon points="334,334 394,394 414,374 354,314" fill="url(#sparkGrad)" />

    <!-- Spark Diamond Star -->
    <polygon points="410,360 422,376 438,376 426,388 430,404 410,396 390,404 394,388 382,376 398,376" fill="#FFFFFF" />
  </g>
</svg>
