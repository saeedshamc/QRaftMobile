<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>

    <!-- Top-Left Finder Eye Gradient -->
    <linearGradient id="eyeTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Top-Right Finder Eye Gradient -->
    <linearGradient id="eyeTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Bottom-Left Finder Eye Gradient -->
    <linearGradient id="eyeBL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Central "Q" Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Q Tail Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Drop Shadow Filter for Luxury Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="none" stroke="url(#glowBorder)" stroke-width="4" />

  <!-- Ambient Light Reflection inside Card -->
  <ellipse cx="256" cy="110" rx="180" ry="60" fill="#38BDF8" opacity="0.08" />

  <!-- Top-Left Finder Eye -->
  <g filter="url(#softGlow)">
    <rect x="80" y="80" width="128" height="128" rx="28" ry="28" fill="url(#eyeTL)" />
    <rect x="104" y="104" width="80" height="80" rx="16" ry="16" fill="#0F172A" />
    <rect x="120" y="120" width="48" height="48" rx="10" ry="10" fill="#38BDF8" />
  </g>

  <!-- Top-Right Finder Eye -->
  <g filter="url(#softGlow)">
    <rect x="304" y="80" width="128" height="128" rx="28" ry="28" fill="url(#eyeTR)" />
    <rect x="328" y="104" width="80" height="80" rx="16" ry="16" fill="#0F172A" />
    <rect x="344" y="120" width="48" height="48" rx="10" ry="10" fill="#A78BFA" />
  </g>

  <!-- Bottom-Left Finder Eye -->
  <g filter="url(#softGlow)">
    <rect x="80" y="304" width="128" height="128" rx="28" ry="28" fill="url(#eyeBL)" />
    <rect x="104" y="328" width="80" height="80" rx="16" ry="16" fill="#0F172A" />
    <rect x="120" y="344" width="48" height="48" rx="10" ry="10" fill="#34D399" />
  </g>

  <!-- High-Tech Matrix Connecting Nodes -->
  <!-- Top Center Data Block -->
  <rect x="236" y="84" width="40" height="40" rx="10" ry="10" fill="#818CF8" />
  <circle cx="256" cy="160" r="10" fill="#38BDF8" />

  <!-- Center Right Data Block -->
  <rect x="388" y="236" width="40" height="40" rx="10" ry="10" fill="#C084FC" />
  <circle cx="320" cy="256" r="10" fill="#818CF8" />

  <!-- Bottom Center Data Block -->
  <rect x="236" y="388" width="40" height="40" rx="10" ry="10" fill="#2DD4BF" />
  <circle cx="256" cy="320" r="10" fill="#34D399" />

  <!-- Center "Q" Craft Glyph with Cybernetic Flow -->
  <g filter="url(#softGlow)">
    <!-- Outer Ring of Q -->
    <path d="M256,180 C206,180 172,214 172,264 C172,314 206,348 256,348 C280,348 302,338 318,322 L346,350 L372,324 L344,296 C354,286 360,274 360,264 C360,214 316,180 256,180 Z M256,212 C286,212 318,230 318,264 C318,280 310,296 298,306 L282,290 L260,312 C258,314 256,314 256,314 C224,314 208,290 208,264 C208,234 228,212 256,212 Z" fill="url(#qGrad)" />

    <!-- Q Tail Arrow / Craft Diamond -->
    <polygon points="340,340 390,390 420,360 370,310" fill="url(#sparkGrad)" />

    <!-- Diamond Core Spark -->
    <polygon points="380,350 390,340 400,350 390,360" fill="#FFFFFF" />
  </g>

  <!-- Micro Craft Sparkles -->
  <polygon points="256,140 260,150 270,150 262,156 265,166 256,160 247,166 250,156 242,150 252,150" fill="#38BDF8" />
  <polygon points="410,410 414,420 424,420 416,426 419,436 410,430 401,436 404,426 396,420 406,420" fill="#F472B6" />
</svg>
